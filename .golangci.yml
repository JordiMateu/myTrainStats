version: "2"

linters:
  enable:
    - wsl_v5
  settings:
    wsl_v5:
      enable:
        - after-block
    errcheck:
      exclude-functions:
        # bytes.Buffer writes always return nil errors.
        - fmt.Fprint(*bytes.Buffer)
        - fmt.Fprintf(*bytes.Buffer)
        - fmt.Fprintln(*bytes.Buffer)

formatters:
  enable:
    - gofumpt
